[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
# The ERC-3643 / KAIO / ERC-1404 token contracts were written against
# OpenZeppelin v4 (security/Pausable.sol, _beforeTokenTransfer) and do not
# compile under the v5 dependency pinned in package.json. The compliance core
# tested here (IdentityRegistry, JurisdictionCompliance, SimpleRestrictor)
# is OZ v5 compatible, so we skip the v4-only token contracts.
skip = [
    "contracts/ERC3643Token.sol",
    "contracts/kaio/KaioToken.sol",
    "contracts/erc1404/Restricted1404Token.sol",
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
